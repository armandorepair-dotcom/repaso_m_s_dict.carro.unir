    let currentActivity = 1;

    function switchToActivity(targetNum, resetMode = false) {
      [1, 2, 3].forEach((num) => {
        if (frames[num] && frames[num].contentWindow) {
          frames[num].contentWindow.postMessage({ type: 'STOP_VOICE' }, '*');
        }
        frames[num].classList.remove('active');
      });

      currentActivity = targetNum;
      const targetFrame = frames[targetNum];
      targetFrame.classList.add('active');

      setTimeout(() => {
        if (targetFrame && targetFrame.contentWindow) {
          if (resetMode && targetNum === 1) {
            targetFrame.contentWindow.postMessage({ type: 'RESET_ACTIVITY' }, '*');
          } else {
            targetFrame.contentWindow.postMessage({ type: 'ACTIVATE_ACTIVITY' }, '*');
          }
        }
      }, 150);
    }

      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'GO_TO_ACTIVITY' && [1, 2, 3].includes(data.activity)) {
        switchToActivity(data.activity, false);
      } else if (data.type === 'RESTART_ALL_TO_ACTIVITY_1') {
